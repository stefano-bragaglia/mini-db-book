[project]
name = "minidb-book"
version = "0.1.0"
description = "A small relational database in pure Python, built one subsystem at a time in an accompanying book"
readme = "README.md"
authors = [
    { name = "Stefano Bragaglia", email = "stefano-bragaglia@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []
keywords = ["database", "relational", "sql", "b-tree", "transactions", "education", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Education",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/stefano-bragaglia/mini-db-book"
Documentation = "https://github.com/stefano-bragaglia/mini-db-book/blob/main/docs/minidb-book/index.md"
Source = "https://github.com/stefano-bragaglia/mini-db-book"
Issues = "https://github.com/stefano-bragaglia/mini-db-book/issues"

[dependency-groups]
dev = ["ruff>=0.15"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "minidb"  # the distribution is "minidb-book"; the import name stays "minidb"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src"]
extend-exclude = [".idea"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D105", # docstring in magic methods (dunders are not documented)
    "D107", # docstring in __init__ (the class docstring covers it)
    "EM", # exception message must not be a string literal
    "TRY003", # long messages outside the exception class
    "CPY", # copyright header
    "COM812", # trailing comma (conflicts with the formatter)
    "T201", # print
    "S101", # assert
    "PLR2004", # magic values in comparisons
    "PLR0913", # too many arguments
    "E501", # line too long (the formatter handles it)
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "pep257" # Standard reStructuredText-compatible docstring style

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.mccabe]
# Grade A complexity corresponds to a score of 1 to 5
max-complexity = 5

[tool.ruff.lint.pep8-naming]
# Qt virtual overrides are camelCase (mousePressEvent, sizeHint, ...)
extend-ignore-names = ["*Event", "sizeHint", "minimumSizeHint", "boundingRect", "paint", "itemChange", "shape"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pyrefly — type checker
# ---------------------------------------------------------------------------
[tool.pyrefly]
preset = "strict"           # ~ basedpyright typeCheckingMode = "all"
project-includes = ["src"]
python-version = "3.14"
search-path = ["src"]

[tool.pyrefly.errors]
unused-call-result = false  # ~ reportUnusedCallResult = false
