name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14
      - run: uv sync
      - run: uv run ruff format --check src tests examples
      - run: uv run python -m examples.run_tests
      - run: uv build
